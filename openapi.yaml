openapi: 3.1.0
info:
  title: Focus Lab Operations API
  version: 0.1.0
  description: Review-stage contract. Inquiry receipt never confirms availability.
servers:
  - url: http://localhost:8787
paths:
  /v1/inquiries:
    post:
      summary: Persist a website inquiry for human review
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InquiryRequest' }
      responses:
        '201': { description: Persisted, content: { application/json: { schema: { $ref: '#/components/schemas/InquiryCreated' } } } }
        '200': { description: Idempotent replay, content: { application/json: { schema: { $ref: '#/components/schemas/InquiryCreated' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/chat/status:
    get:
      summary: Resolve provider-neutral customer messaging state
      responses:
        '200':
          description: Current public status
          content:
            application/json:
              schema:
                type: object
                required: [state,label,destinationUrl,checkedAt]
                properties:
                  state: { enum: [live,async,unavailable] }
                  label: { type: string }
                  destinationUrl: { type: [string,'null'], format: uri }
                  checkedAt: { type: string, format: date-time }
  /v1/internal/presence/heartbeat:
    post:
      summary: Set and refresh explicit responder availability
      security: [{ accessAssertion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [available]
              properties:
                available: { type: boolean }
      responses:
        '200': { description: Presence updated }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/internal/inquiries:
    get:
      summary: List or search inquiries
      security: [{ accessAssertion: [] }]
      parameters:
        - in: query
          name: query
          schema: { type: string }
      responses:
        '200': { description: Inquiry summaries }
        '401': { $ref: '#/components/responses/Error' }
  /v1/internal/inquiries/{inquiryId}:
    get:
      summary: Read inquiry, event, contact, services, notes, assignments, activity and conversation metadata
      security: [{ accessAssertion: [] }]
      parameters: [{ $ref: '#/components/parameters/InquiryId' }]
      responses:
        '200': { description: Internal detail }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/internal/inquiries/{inquiryId}/workflow:
    patch:
      summary: Update internal workflow state
      security: [{ accessAssertion: [] }]
      parameters: [{ $ref: '#/components/parameters/InquiryId' }]
      responses: { '200': { description: Updated }, '401': { $ref: '#/components/responses/Error' } }
  /v1/internal/inquiries/{inquiryId}/notes:
    post:
      summary: Add an internal-only note
      security: [{ accessAssertion: [] }]
      parameters: [{ $ref: '#/components/parameters/InquiryId' }]
      responses: { '201': { description: Created }, '401': { $ref: '#/components/responses/Error' } }
  /v1/internal/inquiries/{inquiryId}/assignment:
    patch:
      summary: Assign or unassign a responder
      security: [{ accessAssertion: [] }]
      parameters: [{ $ref: '#/components/parameters/InquiryId' }]
      responses: { '200': { description: Updated }, '401': { $ref: '#/components/responses/Error' } }
  /v1/internal/inquiries/{inquiryId}/capacity:
    patch:
      summary: Set explicit event capacity blocking
      security: [{ accessAssertion: [] }]
      parameters: [{ $ref: '#/components/parameters/InquiryId' }]
      responses: { '200': { description: Updated }, '401': { $ref: '#/components/responses/Error' } }
  /v1/internal/inquiries/{inquiryId}/conflicts:
    get:
      summary: Get internal scheduling decision support
      security: [{ accessAssertion: [] }]
      parameters: [{ $ref: '#/components/parameters/InquiryId' }]
      responses: { '200': { description: Scheduling assessment }, '401': { $ref: '#/components/responses/Error' } }
  /v1/internal/responders:
    get: { summary: List active internal responders and presence, security: [{ accessAssertion: [] }], responses: { "200": { description: Active responders }, "401": { $ref: "#/components/responses/Error" } } }
  /v1/internal/status:
    get: { summary: Read aggregate operational status, security: [{ accessAssertion: [] }], responses: { "200": { description: Internal status }, "401": { $ref: "#/components/responses/Error" } } }
  /v1/internal/inbox:
    get:
      summary: Read the bounded filtered staff inbox
      security: [{ accessAssertion: [] }]
      parameters:
        - { in: query, name: query, schema: { type: string, maxLength: 120 } }
        - { in: query, name: workflow, schema: { type: string } }
        - { in: query, name: assignment, schema: { type: string, maxLength: 100 } }
        - { in: query, name: eventFamily, schema: { type: string, maxLength: 100 } }
        - { in: query, name: date, schema: { type: string, format: date } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 25 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 5000, default: 0 } }
      responses: { "200": { description: Inbox page }, "401": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /v1/internal/schedule:
    get:
      summary: Read an event range with scheduling assessments
      security: [{ accessAssertion: [] }]
      parameters:
        - { in: query, name: start, required: true, schema: { type: string, format: date } }
        - { in: query, name: end, required: true, schema: { type: string, format: date } }
        - { in: query, name: state, schema: { type: string, default: all } }
      responses: { "200": { description: Range events and assessments }, "401": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /v1/internal/conversations:
    get: { summary: List provider-neutral conversation metadata, security: [{ accessAssertion: [] }], responses: { "200": { description: Conversation metadata }, "401": { $ref: "#/components/responses/Error" } } }
  /v1/internal/me:
    get:
      summary: Resolve the authenticated staff identity and application role
      security: [{ accessAssertion: [] }]
      responses:
        '200': { description: Minimal current-user context }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    accessAssertion:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: Production requires a validated Cloudflare Access application JWT plus active D1 staff authorization. Explicit local development mode uses a separate bearer-token adapter.
  parameters:
    InquiryId: { in: path, name: inquiryId, required: true, schema: { type: string } }
  responses:
    Error:
      description: Typed error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    InquiryRequest:
      type: object
      additionalProperties: false
      required: [eventType,date,services,name,email,contact,turnstileToken]
      properties:
        eventType: { type: string, maxLength: 100 }
        date: { type: string, format: date }
        endDate: { type: string, format: date }
        startTime: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }
        endTime: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }
        location: { type: string, maxLength: 300 }
        services: { type: array, maxItems: 20, items: { type: string, maxLength: 100 } }
        guests: { oneOf: [{ type: integer, minimum: 1, maximum: 100000 },{ type: string, pattern: '^\\d{1,6}$' }] }
        budget: { type: string, maxLength: 100 }
        name: { type: string, maxLength: 150 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, maxLength: 40 }
        contact: { enum: [email,phone] }
        note: { type: string, maxLength: 4000 }
        source: { type: string, maxLength: 100 }
        turnstileToken: { type: string, minLength: 1, maxLength: 2048, description: Short-lived token verified server-side with Cloudflare Siteverify }
        website: { type: string, maxLength: 300, description: Honeypot; legitimate clients send an empty string }
    InquiryCreated:
      type: object
      required: [ok,inquiryId,eventId,createdAt,idempotentReplay,status,message]
      properties:
        ok: { const: true }
        inquiryId: { type: string }
        eventId: { type: string }
        createdAt: { type: string, format: date-time }
        idempotentReplay: { type: boolean }
        status: { const: received_for_review }
        message: { type: string }
    Error:
      type: object
      required: [ok,error]
      properties:
        ok: { const: false }
        error:
          type: object
          required: [code,message]
          properties:
            code: { type: string }
            message: { type: string }
            fields: { type: object, additionalProperties: { type: array, items: { type: string } } }
